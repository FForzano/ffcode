# Multi-repo workspace. Clones live in .ffcode/repos/<name> (git-ignored). Run: ffcode workspace sync
[[repo]]
name = "formandopercorsi-backend"
self = true                 # the repo that holds this .ffcode/
role = "backend"
url = "git@github.com:FormandoPercorsi/formandopercorsi-backend.git"
contracts = ["docs/openapi.json"]

[[repo]]
name = "formandopercorsi-frontend"
role = "frontend"
url = "git@github.com:FormandoPercorsi/formandopercorsi-frontend.git"
local = "~/Documents/FPC-DEV/formandopercorsi-frontend"   # optional: --from-local clones from here
depends_on = ["formandopercorsi-backend"]

[[repo]]
name = "aws"
role = "infra"
url = "git@github.com:FormandoPercorsi/aws.git"
depends_on = ["formandopercorsi-backend", "formandopercorsi-frontend"]
